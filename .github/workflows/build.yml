name: Build GBA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v1
      - name: Build ROM
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ROM file
          path: snake.gba
          archive: false
